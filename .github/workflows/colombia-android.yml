name: Colombia 2015 Filament Android
on:
  push:
    branches: [colombia-2015]
    paths: ['ColombiaNative/**', '.github/workflows/colombia-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native Android APK
        working-directory: ColombiaNative
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          cp ColombiaNative/app/build/outputs/apk/debug/app-debug.apk build/Colombia2015.apk
          test -s build/Colombia2015.apk
          gh release create "colombia-filament-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" build/Colombia2015.apk --target "$GITHUB_SHA" --title "Colombia 2015 Filament — build ${GITHUB_RUN_NUMBER}" --notes "Native renderer prototype, debug signed." --prerelease
