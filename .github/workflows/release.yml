name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android build components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Build debug and release variants
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Prepare installable debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Ventoy-Android-${GITHUB_REF_NAME}-debug.apk"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ventoy-android-apks
          path: |
            Ventoy-Android-*-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ventoy Android ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            The debug APK is signed with the standard Android debug key and is intended for testing.
            The release variant is currently unsigned until a dedicated release-signing key is configured.
            This build is an early Android application scaffold; USB installation of the Ventoy boot engine is not implemented yet.
          files: |
            Ventoy-Android-*-debug.apk
            app/build/outputs/apk/release/*.apk
